[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-scoreboard-tornado"
version = "0.1.0"
description = "Real-time sports scoreboard: Tornado WebSocket fan-out over Redis pub/sub."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Georghiou" }]
requires-python = ">=3.11"
dependencies = [
  "tornado>=6.4,<7",
  "redis>=5.0,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "fakeredis>=2.26",
]

[project.scripts]
scoreboard = "scoreboard.app:main"
scoreboard-sim = "scoreboard.simulator:main"

[tool.setuptools.packages.find]
include = ["scoreboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "redis: tests that need a real Redis server (REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
